spring.application.name=crosswords_backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Only a reference to the environment variable. The key itself must never be written here.
crossword.api.base-url=https://crossword.texs.org/api/v1
crossword.api.key=${CROSSWORD_API_KEY}
anthropic.api.key=${ANTHROPIC_API_KEY}
