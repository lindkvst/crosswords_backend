spring.application.name=crosswords_backend

# Settings shared by all profiles. The profile files only hold what differs between dev and prod.
# dev is the default, so running the app from IntelliJ works as before.
# On a server, the environment variable SPRING_PROFILES_ACTIVE=prod overrides this line.
spring.profiles.active=dev

# Only a reference to the environment variable. The key itself must never be written here.
crossword.api.base-url=https://crossword.texs.org/api/v1
crossword.api.key=${CROSSWORD_API_KEY}
# Language for both words and clues. Changing it does not translate crosswords already saved.
crossword.api.language=da

# Claude (Anthropic). Again only a reference to the environment variable.
anthropic.api.base-url=https://api.anthropic.com/v1
anthropic.api.key=${ANTHROPIC_API_KEY}
anthropic.api.version=2026-10-21
# The three models are listed in the ClaudeModel enum, and the player chooses one.

# The only browser origin allowed to call the API (CORS). IntelliJ's built-in server in dev; prod overrides it.
app.cors.allowed-origin=http://localhost:63342
