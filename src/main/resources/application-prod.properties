# Production. Every value that differs per server comes from an environment variable.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# validate only checks that the tables match the entities and never changes the database.
# The app refuses to start if they do not match, instead of quietly altering live data.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# The address the frontend is served from in production, e.g. https://crosswords.example.dk
app.cors.allowed-origin=${FRONTEND_ORIGIN}
