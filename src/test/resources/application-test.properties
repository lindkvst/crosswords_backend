# Tests run on an in-memory H2 database, so they need no MySQL and no secrets (also on GitHub Actions).
# MODE=MySQL makes H2 accept the same SQL as our MySQL database. Each Spring test context gets its own
# database (random name), so create-drop in one context cannot drop the tables another context uses.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Dummy values. The tests replace both API clients with mocks, and port 1 makes any real call fail at once.
crossword.api.base-url=http://localhost:1
crossword.api.key=test-dummy
anthropic.api.base-url=http://localhost:1
anthropic.api.key=test-dummy

# Dummy signing key for the tests' tokens (at least 32 bytes).
app.jwt.secret=test-dummy-secret-for-jwt-at-least-32-bytes
